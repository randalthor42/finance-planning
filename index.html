<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Runway · money planner</title>
<meta name="description" content="Plan your money month by month: income, bills, trips, wishes and savings. Works offline; your data is kept on your devices, and in your own Google Drive only if you turn on sync.">
<meta name="application-name" content="Runway">
<!-- the bar above the app: follows the system theme until the app draws (ui/pwa.js themeColor); APP.colors -->
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#2457d6">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#161d25">
<!-- installed on a phone: full screen, no browser bars (Android, iOS) -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Runway">
<!-- iOS: the page runs under the status bar (white text); styles/pwa.css keeps content clear of it and colours it -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- amounts are not phone numbers -->
<meta name="format-detection" content="telephone=no">
<!-- the manifest is linked by ui/pwa.js over http(s) only; the icons are added inline by build/pwa.js -->
</head>
<body>
<div id="app">
  <header class="top" id="top"></header>
  <aside class="side" id="side"></aside>
  <div id="scrim"></div>
  <main id="main" tabindex="-1"></main>
</div>
<div id="toasts" popover="manual" aria-live="polite"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
